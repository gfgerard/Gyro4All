; Gyro4All profile for Severed Steel (UE 4.27.2; verified on the Steam demo with GyroUE 0.6.19, DualSense).
; PlayerCharacter turns its FirstPersonCamera component from the camera's own world rotation every frame
; (look input -> SetWorldRotation) and copies it to ControlRotation, so ControlRotation is only an output.
; The camera uses absolute rotation: WorldRotation=1 writes its RelativeRotation and its world rotation together.

[View.Default]
Label=Exploration
Object=Pawn.FPCamera
Property=RelativeRotation
WorldRotation=1
