; Gyro4All profile for PAYDAY3-Win64-Shipping.
; Default view: ControlRotation (normal play).
; During some actions the camera is turned by SBZClampCameraRotationModifier and ControlRotation becomes an output:
; Gyro4All switches to the Clamp view while the camera follows it, and back (Match=Camera).
; Learned by the GyroUE 0.9.1 camera probe on 2026-10-16 (view target CH_Star_C). Live test: yaw followed, pitch
; followed, it also turns the character.

[Gyro4All]
Views=Clamp

[View.Default]
Label=Exploration

[View.Clamp]
Id=2
Label=Clamp Camera
Match=Camera
Parent=1
Object=Camera.@SBZClampCameraRotationModifier
Offsets=0x68
RotatorSize=24
