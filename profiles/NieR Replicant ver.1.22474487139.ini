; Gyro4All profile for NieR Replicant ver.1.22474487139 (Toylogic engine, the Toylogic module turns the camera).
; The game has no PlayStation controller support: it reads a DualSense as a generic DirectInput pad (generic prompts).
; It makes an Xbox controller only of a DirectInput controller whose WMI DeviceID has "IG_" (Microsoft's IsXInputDevice
; sample), so XInput=2 (which hides the DualSense from DirectInput) leaves it with none. Auto mode works: the DualSense
; is shown as an Xbox controller (Xbox prompts). Set here over a Gyro4All.ini that turned it off.

[Gyro4All]
XInput=1
