; Gyro4All profile for Star Wars Jedi: Fallen Order (UE 4.21, Steam). Verified in game with a DualSense (BT).
; The game's own PlayStation support only knows the DualShock 4: the DualSense is shown to it as one.
; The camera is Respawn's RsCameraManager: its active RsCameraMode writes ModeOutputs each frame and the POV is
; ModeOutputs.Rotation + ModeOutputs.RotationOffsetWS; ControlRotation and the POV caches are only outputs.
; ModeOutputs.Rotation (a float rotator nested in the reflected ModeOutputs struct, found by reflection at startup;
; +0x274C in the Steam build) keeps a written turn: a one-shot write (+30 yaw / +10 pitch) moved the camera and
; stayed, orbiting the character. The automatic probe verifies and writes this same view by itself.

[Gyro4All]
DualSenseAsDualShock4=1

[View.Default]
Label=Exploration
Object=Camera
Property=ModeOutputs.Rotation
