; Gyro4All profile: Life is Strange Remastered (UE 4 with UProperty objects, DX11, Deck Nine). File name = game exe name
; without ".exe". Found with the automatic camera probe and a manual walking capture; verified in game on 2026-10-09
; (see MODLOG.md). DX11: the F10 panel comes from Gyro4All\gyro4all.dll (not verified in this game yet); Gyro4All\gyrolib.ini works too.
;
; The camera splits the axes in non-reflected state of LiSPlayerCameraManager: pitch from the float rotators at
; +0x33CC/+0x33FC (the game reads, integrates and writes them back every frame), yaw while following Max from +0x3ACC.
; While Max walks, the walk camera mode PC.TP_Walk_Manual_C blends to its automatic follow camera
; (SmoothedAutoManualRatio -> 0) unless the right stick is used; OnGyro keeps it manual (1) whenever the gyro turns
; the camera, so the follow camera doesn't override the gyro's yaw.

[View.Default]
Label=Exploration
Object=Camera
Offsets=0x33CC,0x33FC,0x3ACC
RotatorSize=12
OnGyro=PC.@TP_Walk_Manual_C.SmoothedAutoManualRatio:1
