; Gyro4All profile for Hogwarts Legacy (UE 4.27, Steam). NOT VERIFIED IN GAME YET.
; The gameplay camera is its own actor (BP_ThirdPersonCameraStackActor_C) driven by a camera stack. Its persistent
; look rotation is a non-reflected float rotator in the stack object (BehaviorStack, class CameraStack) at +0x68,
; mirrored at +0x80; ControlRotation and the POV are only outputs. Found with a read-only memory scan while turning
; the camera with the stick, and confirmed by a one-shot write (+45 yaw / +10 pitch moved the camera and stayed).

[View.Default]
Label=Exploration
Object=ViewTarget.BehaviorStack
Offsets=0x68,0x80
RotatorSize=12
