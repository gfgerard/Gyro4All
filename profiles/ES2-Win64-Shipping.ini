; Gyro4All profile for EVERSPACE 2 (Steam, UE5). Verified 2026-11-18 (DualSense, Steam Input off): the gyro turns the ship 1:1.
; The ship (BP_Ship_Player_C) is a physics body flown by its ESPawn.ShipMovement component: memory writes to its
; rotation are undone by the physics. The gyro turns it through the engine instead: SceneComponent's
; K2_AddLocalRotation on the ship's root (CollisionRoot0) with bTeleport, in the ship's own axes. RelativeRotation
; is only read (status, follow check). The ship's roll makes the level pitch meaningless: no recenter.

[View.Default]
Label=Ship
Object=Pawn.CollisionRoot0
Property=RelativeRotation
Function=K2_AddLocalRotation
Recenter=0
