; Gyro4All profile: Resident Evil 7 biohazard (RE Engine, TDB 70, the 2022+ DX12 build). File name = game exe name
; without ".exe". See MODLOG.md (2026-10-15).
;
; Controller: the game creates DirectInput and imports the HID library, but reads neither a DualSense nor a DualSense
; shown to it as a DualShock 4 (it opens the controller and closes it again unread). With Steam Input off it would
