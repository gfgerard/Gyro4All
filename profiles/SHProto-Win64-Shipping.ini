; Gyro4All profile: Silent Hill 2 (remake, UE 5, Bloober Team). File name = game exe name without ".exe".
; Verified in game on 2026-10-30 (DualSense; see MODLOG.md): standing, walking and aiming.
;
; Same framework as Cronos: the right stick doesn't use ControlRotation. The look state is non-reflected C++ in the
; pawn's View component (SHCharacterPlayViewComponent), two double rotators at +0x470 and +0x4F8 (Cronos: +0x2A0/+0x420,
; which are wrong here). The gyro delta is added to both; it turns the camera and, while aiming, James.
; Pawn.SpringArm (+0x1E0/+0x348) also follows the camera but is an output: the game rebuilds it from View.

[View.Default]
Label=Exploration
Object=Pawn.View
Offsets=0x470,0x4F8
RotatorSize=24
