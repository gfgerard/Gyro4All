[Unity]
; Firewatch's look state: vgCameraController.cameraModeStack, a LinkedList of camera modes (newest first). The player's
; mode (stick or mouse input, body metaphor) adds the input to its localOffset every frame: x = yaw, y = pitch, degrees,
; pitch up. The game turns PlayerCamera from that sum and the body (PlayerModel) catches up with the yaw by itself.
ObjectType=vgCameraController
PitchPath=cameraModeStack[vgCameraModeInstance].localOffset.y
PitchPerDegree=1
YawPath=cameraModeStack[vgCameraModeInstance].localOffset.x
YawPerDegree=1
; localOffset.x shrinks as the body catches up: the view's yaw is the camera's (not an undone write).
YawFromCamera=1
; The unzoomed vertical FOV (the game's FOV option adds fovAdjust to it).
ZoomReference=baseFOV
ZoomReferenceAxis=Vertical
