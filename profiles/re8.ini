; Gyro4All profile: Resident Evil Village (RE Engine, TDB 69). File name = game exe name without ".exe". See
; MODLOG.md (2026-10-17).
;
; Controller: like Resident Evil 7, the game creates DirectInput and imports the HID library, but doesn't read a
; DualSense, nor a DualSense shown to it as a DualShock 4 (it opens the controller and closes it again unread). With
; this setting Gyro4All doesn't try the DualShock 4 identity and shows the DualSense as an Xbox controller a few
; seconds after start (auto mode, verified in game).

[Gyro4All]
DualSenseAsDualShock4=0
