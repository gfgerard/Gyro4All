; Gyro4All profile: Dead Island 2 (UE4). The game rebuilds the view's yaw from the character's capsule every frame,
; so the gyro takes the right stick's path: it is added to PlayerController.RotationInput inside the controller's
; UpdateRotation (found by its shape, see ADVANCED.md, "The stick's look input").
;
; Scripted scenes: the game moves the character along a path with its CharacterMovement in MOVE_Flying (5; walking is
; 1 in play), and the stick doesn't turn the camera there. The gyro pauses while it holds.
[Gyro4All]
PauseConditions=Pawn.CharacterMovement.MovementMode==5

[View.Default]
Label=Exploration
Property=RotationInput
