; Gyro4All profile: Cronos: The New Dawn (UE 5.4.4, Bloober Team). File name = game exe name without ".exe".
; Verified in game on 2026-10-08 (see MODLOG.md).
;
; The right stick doesn't use ControlRotation: the look state is non-reflected C++ in the pawn's
; View component (SHCharacterPlayViewComponent), two double rotators at +0x2A0 and +0x420 that always
; hold the same value and match the camera POV. The gyro delta is added to both.
; Diagnostics: [Gyro4All] Probe=1 enables F7 (snapshot) / F8 (diff) in Gyro4All.log.

[View.Default]
Label=Exploration
Object=Pawn.View
Offsets=0x2A0,0x420
RotatorSize=24
