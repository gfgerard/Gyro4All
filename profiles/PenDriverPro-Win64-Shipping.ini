; Gyro4All profile: Pacific Drive (UE 4.27). File name = game exe name without ".exe".
; Verified with GyroCamProbe on 2026-10-08 (see MODLOG.md).
;
; The default view turns PlayerController.ControlRotation (on foot).
; Extra views apply when the camera's view target is of ViewTargetClass, and add the gyro
; deltas to the rotator Property on that view target instead.
; Notes for this game:
;   - UE4SS GuiConsoleEnabled must stay 0.
;   - F11 toggles fullscreen.

[Gyro4All]
Views=InCar

[View.Default]
Label=On foot

[View.InCar]
Id=2
Label=In car
ViewTargetClass=BP_PlayerCarNew_C
; Smoothed by the car BP into CameraControllerRotation_Current; yaw clamped to +/-140 by the BP.
Property=CameraControllerRotation_Target
; Settings inherit from view 1 (On foot) until changed for this view.
Parent=1
; Gyro has priority over the car's auto-recentering while driving: when the gyro moves the view,
; write what the game itself sets when the player looks with the right stick (probe v2 diff).
OnGyro=IsAutoControlling:0,Camera_AutoControlAmount_target:0,Camera_AutoControlAmount_current:0
; Diagnostics (off): Dump=1 logs all car properties once; Watch=IsAutoControlling,Camera_AutoControlAmount_target
