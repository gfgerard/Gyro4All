; EVERSPACE (Ultimate Edition, UE 4.20) - TEST, not verified.
; The game only reads XInput: its DirectInput enumeration opens the DualSense's HID device, which made Gyro4All take
; it for native PlayStation support. XInput=2 shows the controller to the game as an Xbox one anyway.
; View: as in EVERSPACE 2, the ship turned through the engine (K2_AddLocalRotation with teleport) on the pawn's root
; component, whatever it is called in this game.

[Gyro4All]
XInput=2

[View.Default]
Label=Ship
Object=Pawn.RootComponent
Property=RelativeRotation
Function=K2_AddLocalRotation
Recenter=0
