; Gyro4All profile: Mass Effect 3 (Legendary Edition, Unreal Engine 3). File name = game exe name without ".exe".
; See MODLOG.md (2026-10-30).
;
; The gyro turns the player controller's Rotation and the game keeps those writes. The stick fallback still started
; now and then (the gyro pushed against the pitch limit, which the Unreal3 module doesn't trim, or a scene that takes
; the camera over) and then drifted the camera toward wherever the right stick rests: its deflection is added to the
; stick's resting offset, and the game's dead zone then lets through only the pulses on that side. Never needed here.

[Gyro4All]
StickFallback=0

; Zoom compensation: the rendered unzoomed field of view is 100 horizontal (Camera.CameraCache.POV.FOV), not
; PlayerController.DefaultFOV (85), which would make unzoomed play about 1.3x faster with Adapt to Zoom on
; (MODLOG 2026-10-30, PR #13). Change it if a mod or setting changes the game's field of view.
[Unreal3]
ZoomReferenceFOV=100
