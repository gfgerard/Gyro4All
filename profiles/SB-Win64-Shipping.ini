; Gyro4All profile for SB-Win64-Shipping, written by Gyro4All.
; The game's own PlayStation support only knows the DualShock 4: the DualSense is shown to it as one.

[Gyro4All]
Views=Range,Aim

; Learned by the Gyro4All 1.12.0 camera probe on 2026-11-19 17:27 (view target CH_P_EVE_01_Blueprint_C).
; Live test: yaw followed, pitch followed, camera moved 14.8 for an expected 17.5 (orbit radius 341). Used while the camera follows it (Match=Camera).
[View.Default]
Label=Exploration
Match=Camera
Parent=1
Object=Pawn.CameraBoom
Property=RelativeRotation
WorldRotation=1
; The game copies the camera's yaw into ControlRotation (which the character moves along) only on stick input.
ControlYaw=1

; Aim (L2): the camera ignores the boom and aims along the character's non-reflected aim direction, a float forward
; vector at +0x1534 (copy at +0x154C); the character's tick then sets ControlRotation's yaw from the camera. Used from
; the frame the camera component enters its aim (TPS) mode.
[View.Aim]
Id=2
Label=Aim
ActiveWhen=Pawn.@SBCameraComponent.bCurrentCameraTPSMode
Object=Pawn
Offsets=0x1534,0x154C
Direction=1

; Cover shooting minigame: the camera stays fixed and the right stick moves a crosshair, the character's
; NikkeTPSPinScreenPoint (+0x159C, x and y as 0..1 of the screen). Used while the character is in that aim mode
; (TPSModeType 2), ahead of the Aim view. The spans are about the minigame camera's field of view.
[View.Range]
Id=3
Label=Cover range
ActiveWhen=Pawn.TPSModeType==2
Object=Pawn
Offsets=0x159C
ScreenPoint=80,46
