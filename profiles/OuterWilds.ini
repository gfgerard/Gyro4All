[Unity]
; Pitch: PlayerCameraController._degreesY (degrees, up), which the game turns into the camera's local rotation every frame.
; Yaw: no float; the game turns Player_Body (the camera's parent) around its own up, the planet's.
ObjectType=PlayerCameraController
PitchPath=_degreesY
PitchPerDegree=1
YawParent=1
; Off at the ship's flight console: the game takes no look input there (the right stick turns the ship).
Look=!_isSnapping, !_isLockedOn, !_shipController._playerAtFlightConsole
