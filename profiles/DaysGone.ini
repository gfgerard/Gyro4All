; Gyro4All profile: Days Gone (Steam, UE 4.11, Bend Studio). File name = game exe name without ".exe".
; Tested in game on 2026-10-30 (DualSense; see MODLOG.md): on foot, aiming and the bike.
;
; The right stick doesn't use ControlRotation (an output). Bend's camera manager (BendCamManagerBP_C) runs one camera
; object per mode (follow, combat, sprint, crouch, aim per weapon, bike...), all BendCamBase: each keeps its view as a
; non-reflected float rotation matrix, the source at +0x120 and the output (what the camera shows) at +0x80. The
; manager's camera stack (native TArray at +0x35D0, newest first; BendCamTransition entries while blending) says which
; camera is active; each view below turns it while it is of the view's classes. Set a view's Activation to Off in the
; settings panel to keep the gyro out of it (e.g. Vehicle).

[Gyro4All]
Views=Vehicle, Aim

[View.Default]
Label=On foot
Object=Camera.@BendPlayerCamFollow_C|BendCamMelee|BendPlayerCamCrawl_C
Offsets=0x120
Matrix=1
OutputMatrix=0x80
ActiveList=0x35D0
ActiveListSkip=BendCamTransition

[View.Vehicle]
Id=2
Label=Vehicle
; Before Aim: the bike's aiming camera (BendVehicleCamFixedAim_C) is a BendCamManualAim too.
Object=Camera.@BendVehicleCamFollow_C|BendVehicleCamFixedAim_C|BendVehicleCamLookBehind_C|BendVehiclePassengerCamFollow_C
Offsets=0x120
Matrix=1
OutputMatrix=0x80
ActiveList=0x35D0
ActiveListSkip=BendCamTransition
Parent=1

[View.Aim]
Id=3
Label=Aim
Object=Camera.@BendCamManualAim
Offsets=0x120
Matrix=1
OutputMatrix=0x80
ActiveList=0x35D0
ActiveListSkip=BendCamTransition
Parent=1
