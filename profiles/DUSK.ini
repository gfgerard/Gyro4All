; Gyro4All profile for DUSK.
; DUSK reads the controller through Unity's own joystick input (HID), not XInput. Its controller layout is set in the
; game's mappings\*.ini (controllermode = ds4 or xbox360; shipped as xbox360): with a PlayStation pad set it to ds4.

[Unity]
ObjectType=MyMouseLook
PitchPath=xRotation
PitchPerDegree=-1
YawPath=yRotation
YawPerDegree=1
