; Gyro4All profile: MOUSE: P.I. For Hire (Fumi Games; Unity 6000.3, Mono). File name = game exe name without ".exe".
; See MODLOG.md (2026-11-11) and docs/ADVANCED.md ("Unity games").
;
; The game's look code (Mouse.dll, Mouse.CharacterMovement.PlayerRotationBehaviour) reads the camera's pitch from the
; camera rig's local X angle and the yaw from the player body's Y angle every frame, adds the stick or mouse, clamps
; the pitch to the player's limits and writes them back: the gyro turns the same transforms just before that.
; The view is on while the player's Look input action is enabled (the game disables the whole Player input map in
; menus, dialogue and cutscenes) and the player object is active (not the hub's car map).

[Unity]
Player=Mouse:Player::Instance
Yaw=characterController
Pitch=cameraRigController
PitchMin=_rotationSettings.MinPitch
PitchMax=_rotationSettings.MaxPitch
Look=gameObject.activeInHierarchy, inputs._controls.m_Player_Look.enabled
Camera=playerCamera
ZoomReference=cameraFovController._baseVerticalFOV
