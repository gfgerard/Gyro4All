; Gyro4All profile: MOUSE: P.I. For Hire (Fumi Games; Unity 6000.3, Mono). File name = game exe name without ".exe".
; See MODLOG.md (2026-11-11) and docs/ADVANCED.md ("Unity camera profiles").
;
; The game's look code (Mouse.dll, Mouse.CharacterMovement.PlayerRotationBehaviour) reads the camera rig's local pitch and
; the player body's yaw from their Transforms every frame, adds the stick or mouse, clamps the pitch and writes them back;
; the camera follows the rig through Cinemachine. The gyro turns the same Transforms just before that.
; The view is on while the player object is active (not in the hub's car) and its Look input action is enabled (the game
; disables the whole Player input map in menus, dialogue and cutscenes).
; Zoom compensation: CameraFovController._baseVerticalFOV holds the unzoomed FOV in HORIZONTAL degrees despite its name
; (105, the in-game FOV option; the camera's Camera.fieldOfView is 72.5 vertical at 16:9).

[Unity]
ObjectType=Player
PitchObject=cameraRigController
YawObject=characterController
PitchLimit=89
Look=gameObject.activeInHierarchy, inputs._controls.m_Player_Look.enabled
ZoomReference=cameraFovController._baseVerticalFOV
ZoomReferenceAxis=Horizontal
