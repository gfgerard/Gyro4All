; Gyro4All profile: PowerWash Simulator (FuturLab; Unity, IL2CPP). File name = game exe name without ".exe".
; Found by the Unity camera probe with no input; see MODLOG.md (2026-11-12) and docs/ADVANCED.md ("Unity camera profiles").
;
; Pitch is PlayerCameraController's VerticalLookRotation (degrees, positive down). The yaw lives on HeadTurn, the camera's
; parent, whose local yaw the game reads back every frame (HorizontalLookRotation is a copy of it); the player's root
; object (a Rigidbody) never turns in first person, so it isn't the yaw (Rejected=parent 2).

[Unity]
ObjectType=PWS.PlayerCameraController
CameraField=m_camera
PitchPath=<VerticalLookRotation>k__BackingField
PitchPerDegree=-1
YawParent=1
Rejected=parent 2
